[package]
name = "Catick"
version = "0.1.0"
edition = "2024"

[dependencies]
cairo-rs = { version = "0.22", default-features = false, features = ["png"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
x11rb = { version = "0.14.0", features = ["shape", "xtest"] }
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["event", "fs", "mm", "pipe", "time"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
